name: Deploy app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "helm/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  CLUSTER_NAME: eks-gavinbarbee-dev
  ECR_REPOSITORY: gavinbarbee-listings

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (tagged with commit SHA)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          # Tags are immutable, so skip the push if this commit was already built
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" > /dev/null 2>&1; then
            echo "Image $TAG already exists, skipping build"
          else
            docker build -t "$REGISTRY/$ECR_REPOSITORY:$TAG" app
            docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          fi

      - uses: azure/setup-helm@v4

      - name: Connect to EKS
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Install metrics-server (needed for autoscaling)
        run: |
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo update
          helm upgrade --install metrics-server metrics-server/metrics-server --namespace kube-system --wait

      - name: Deploy with Helm
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          helm upgrade --install listings helm/listings \
            --set image.repository="$REGISTRY/$ECR_REPOSITORY" \
            --set image.tag="$TAG" \
            --wait --timeout 5m

      - name: Show load balancer address
        run: |
          kubectl get svc listings -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
          echo
